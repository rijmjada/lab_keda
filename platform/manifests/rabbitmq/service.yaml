# El NOMBRE de este Service ("rabbitmq") es lo que aparece en las URLs de conexión:
#   consumer (AMQP, mismo namespace) ->  RABBITMQ_HOST=rabbitmq
#   KEDA (HTTP, otro namespace)       ->  rabbitmq.keda-demo.svc.cluster.local:15672
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq            # <- coincide con las labels del pod del Deployment
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: http
      port: 15672
      targetPort: http
