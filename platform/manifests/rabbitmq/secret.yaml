# Credenciales de RabbitMQ. Las usan tres recursos, todos por el NOMBRE de este Secret:
#   - deployment.yaml        (RABBITMQ_DEFAULT_USER / _PASS)  -> crea el usuario en el broker
#   - job-declarar-cola.yaml (USER / PASS)                    -> declara la cola por la API
#   - platform/manifests/keda-demo/deployment-consumer.yaml   -> el consumer se conecta por AMQP
#
# SOLO PARA LABORATORIO: en Git la contraseña va en texto plano. En un entorno real
# se usaría Sealed Secrets, SOPS o External Secrets (ver README, sección "Secretos").
# Sin "namespace": lo pone el ApplicationSet (campo "namespace" de platform.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
type: Opaque
stringData:
  username: demo
  password: demo123
