# La URL con la que KEDA consulta la API de management de RabbitMQ.
# Es lo que la TriggerAuthentication (triggerauthentication.yaml) entrega al scaler.
#
#   http://demo:demo123@rabbitmq.keda-demo.svc.cluster.local:15672/
#   └┬─┘   └────┬─────┘ └─────────────────┬─────────────────┘└─┬─┘
#    │          │                          │                    └ puerto "http" del Service
#    │          │                          └ <service>.<namespace>.svc.cluster.local
#    │          └ usuario:contraseña (los de manifests/rabbitmq/secret.yaml)
#    └ coincide con "protocol: http" del trigger
#
# Nombre largo (con namespace) porque quien consulta es el pod keda-operator, que vive
# en el namespace "keda", no en "keda-demo".
# SOLO PARA LABORATORIO: contraseña en texto plano (ver README, sección "Secretos").
apiVersion: v1
kind: Secret
metadata:
  name: keda-rabbitmq-host
type: Opaque
stringData:
  host: http://demo:demo123@rabbitmq.keda-demo.svc.cluster.local:15672/
